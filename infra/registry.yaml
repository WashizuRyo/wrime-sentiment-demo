AWSTemplateFormatVersion: '2010-09-09'
Description: Private model image repositories for the WRIME demo
Resources:
  LoRARepository:
    Type: AWS::ECR::Repository
    Properties:
      ImageTagMutability: IMMUTABLE
      EmptyOnDelete: true
  FullRepository:
    Type: AWS::ECR::Repository
    Properties:
      ImageTagMutability: IMMUTABLE
      EmptyOnDelete: true
Outputs:
  LoRAImageRepository:
    Value: !GetAtt LoRARepository.RepositoryUri
  FullImageRepository:
    Value: !GetAtt FullRepository.RepositoryUri
