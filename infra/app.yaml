AWSTemplateFormatVersion: '2010-09-09'
Description: WRIME demo HTTP API, CPU Lambda classifiers, and Amplify static hosting
Parameters:
  EnableApiAuth:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
  AuthIssuerBaseUrl:
    Type: String
    Default: ''
    Description: Local Cognito issuer base URL; leave empty on AWS.
  EnableHosting:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Set false for emulators without Amplify support; serve the frontend locally.
  LoRAImageUri:
    Type: String
  FullImageUri:
    Type: String
  FrontendOrigin:
    Type: String
    Default: http://localhost:5173
Conditions:
  CreateAuth: !Equals [!Ref EnableApiAuth, 'true']
  LocalIssuer: !Not [!Equals [!Ref AuthIssuerBaseUrl, '']]
  CreateHosting: !Equals [!Ref EnableHosting, 'true']
Resources:
  UserPool:
    Condition: CreateAuth
    Type: AWS::Cognito::UserPool
    Properties:
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
  UserPoolClient:
    Condition: CreateAuth
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 5
      IdTokenValidity: 5
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
  JwtAuthorizer:
    Condition: CreateAuth
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: CognitoJwt
      AuthorizerType: JWT
      IdentitySource: ['$request.header.Authorization']
      JwtConfiguration:
        Audience: [!Ref UserPoolClient]
        Issuer: !If
          - LocalIssuer
          - !Sub '${AuthIssuerBaseUrl}/${UserPool}'
          - !Sub 'https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${UserPool}'
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteFunctionLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource:
                  - !Sub '${LoRALogGroup.Arn}'
                  - !Sub '${FullLogGroup.Arn}'
  LoRALogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-lora'
      RetentionInDays: 3
  FullLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-full'
      RetentionInDays: 3
  LoRAFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-lora'
      PackageType: Image
      Code:
        ImageUri: !Ref LoRAImageUri
      Role: !GetAtt ExecutionRole.Arn
      Architectures: [arm64]
      MemorySize: 4096
      Timeout: 120
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          MODEL_METHOD: lora
          WRIME_MODEL_ROOT: /opt/models
          HF_HUB_OFFLINE: '1'
  FullFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-full'
      PackageType: Image
      Code:
        ImageUri: !Ref FullImageUri
      Role: !GetAtt ExecutionRole.Arn
      Architectures: [arm64]
      MemorySize: 4096
      Timeout: 120
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          MODEL_METHOD: full
          WRIME_MODEL_ROOT: /opt/models
          HF_HUB_OFFLINE: '1'
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [!Ref FrontendOrigin]
        AllowMethods: [POST]
        AllowHeaders: [content-type, authorization]
  LoRAIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt LoRAFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 30000
  FullIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt FullFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 30000
  LoRARoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      AuthorizationType: !If [CreateAuth, JWT, NONE]
      AuthorizerId: !If [CreateAuth, !Ref JwtAuthorizer, !Ref 'AWS::NoValue']
      AuthorizationScopes: !If [CreateAuth, [aws.cognito.signin.user.admin], !Ref 'AWS::NoValue']
      ApiId: !Ref HttpApi
      RouteKey: POST /predict/lora
      Target: !Sub 'integrations/${LoRAIntegration}'
  FullRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      AuthorizationType: !If [CreateAuth, JWT, NONE]
      AuthorizerId: !If [CreateAuth, !Ref JwtAuthorizer, !Ref 'AWS::NoValue']
      AuthorizationScopes: !If [CreateAuth, [aws.cognito.signin.user.admin], !Ref 'AWS::NoValue']
      ApiId: !Ref HttpApi
      RouteKey: POST /predict/full
      Target: !Sub 'integrations/${FullIntegration}'
  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 2
        ThrottlingRateLimit: 1
  LoRAInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LoRAFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/POST/predict/lora'
  FullInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FullFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/POST/predict/full'
  FrontendApp:
    Condition: CreateHosting
    Type: AWS::Amplify::App
    Properties:
      Name: !Sub '${AWS::StackName}-frontend'
      Platform: WEB
      BuildSpec: |
        version: 1
        frontend:
          phases:
            preBuild:
              commands:
                - npm --prefix frontend ci
            build:
              commands:
                - npm --prefix frontend run build
          artifacts:
            baseDirectory: frontend/dist
            files:
              - '**/*'
          cache:
            paths:
              - frontend/node_modules/**/*
      EnvironmentVariables:
        - Name: VITE_API_BASE_URL
          Value: !GetAtt HttpApi.ApiEndpoint
        - Name: VITE_COGNITO_CLIENT_ID
          Value: !If [CreateAuth, !Ref UserPoolClient, '']
        - Name: VITE_COGNITO_ENDPOINT
          Value: !Sub 'https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}'
Outputs:
  UserPoolId:
    Condition: CreateAuth
    Value: !Ref UserPool
  CognitoClientId:
    Condition: CreateAuth
    Value: !Ref UserPoolClient
  JwtAuthorizerId:
    Condition: CreateAuth
    Value: !Ref JwtAuthorizer
  HttpApiId:
    Value: !Ref HttpApi
  ApiEndpoint:
    Value: !GetAtt HttpApi.ApiEndpoint
  AmplifyAppId:
    Condition: CreateHosting
    Value: !GetAtt FrontendApp.AppId
  LoRAFunctionName:
    Value: !Ref LoRAFunction
  FullFunctionName:
    Value: !Ref FullFunction
