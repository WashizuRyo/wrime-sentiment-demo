name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            src/frontend/package-lock.json
            src/infra/package-lock.json

      - name: Install infrastructure dependencies
        run: npm --prefix src/infra ci
      - name: Type-check infrastructure
        run: npm --prefix src/infra run check

      - name: Install frontend dependencies
        run: npm --prefix src/frontend ci
      - name: Type-check frontend
        run: npm --prefix src/frontend run check
      - name: Build frontend
        run: npm --prefix src/frontend run build

      - name: Synthesize CloudFormation template
        run: npm --prefix src/infra run synth
