name: wrime-floci
services:
  floci:
    image: floci/floci:2.4.0
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      FLOCI_AUTH_VALIDATE_SIGNATURES: "true"
      FLOCI_SERVICES_IAM_SEED_DEPLOYER_PRINCIPAL: "true"
      FLOCI_SERVICES_IAM_ENFORCEMENT_ENABLED: "true"
      FLOCI_SECURITY_ALLOW_PRIVATE_JWT_TARGETS: "true"
      FLOCI_SERVICES_COGNITO_ENFORCE_TOKEN_VALIDITY_LIMITS: "false"
      FLOCI_DOCKER_RESOURCE_NAMESPACE: wrime-sentiment
      FLOCI_SERVICES_ECR_URI_STYLE: path
      FLOCI_SERVICES_ECR_PREFER_LOCAL_IMAGES: "false"
      FLOCI_SERVICES_ECR_KEEP_RUNNING_ON_SHUTDOWN: "false"
      FLOCI_SERVICES_CLOUDFORMATION_ALLOW_STUB_UNSUPPORTED_RESOURCE_TYPES: "false"
      FLOCI_BASE_URL: http://127.0.0.1:4566
      FLOCI_SERVICES_LAMBDA_DOCKER_NETWORK: wrime-floci
      FLOCI_SERVICES_LAMBDA_DOCKER_HOST_OVERRIDE: floci
      FLOCI_SERVICES_LAMBDA_CONTAINER_NAME_PREFIX: wrime-floci
      FLOCI_SERVICES_LAMBDA_HONOUR_ARCHITECTURES: "true"
      FLOCI_SERVICES_LAMBDA_WARM_POOL_MAX_PER_FUNCTION: "1"
      FLOCI_SERVICES_LAMBDA_WARM_POOL_MAX_TOTAL: "2"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - floci
    mem_limit: 1g
  web:
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    profiles: [security]
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8445:8445"
      - "127.0.0.1:9443:9443"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./.local/security/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.local/security/certs:/certs:ro
      - ./.local/security/site:/srv:ro
    tmpfs:
      - /data
      - /config
    networks: [floci]
    mem_limit: 128m

networks:
  floci:
    name: wrime-floci
